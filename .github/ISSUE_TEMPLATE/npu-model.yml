# Filed from the app: Settings → On-device model → "Request a model for this phone's NPU" opens
# this form with the phone filled in (app/src/main/kotlin/app/serene/report/NpuRequest.kt). The
# field ids are the query parameters it sets, so rename them in both places.
name: NPU model request
description: Ask for Helmi's model compiled for your phone's NPU (Snapdragon).
title: "NPU model for "
labels: [npu-model]
body:
  - type: markdown
    attributes:
      value: |
        Helmi's model runs about 3x faster on a phone's NPU, but it has to be compiled for each chip. The quickest way to file this is **Request a model for this phone's NPU** in Helmi's settings, which fills in everything below.

        Once a build exists, we'll ask you to run the NPU benchmark in Settings and paste its report here, because we can only test on chips we have.
  - type: input
    id: soc
    attributes:
      label: Chip
      description: The chip model Android reports (Build.SOC_MODEL), such as SM8650.
      placeholder: SM8650
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: samsung SM-S928B
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "16"
  - type: input
    id: app
    attributes:
      label: Helmi version
      placeholder: 0.1.0 build 162
  - type: textarea
    id: note
    attributes:
      label: Anything else
