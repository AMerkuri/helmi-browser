name: npu-model

# Builds Qwen3-0.6B compiled ahead of time for the Snapdragon 8 Elite's NPU (android/npu-model)
# and uploads it as an artifact. In the app, Settings → On-device model → Pick NPU model takes
# the artifact's .zip as downloaded, and the NPU benchmark then runs it; once it passes on a
# phone, npu-model-release publishes it. Started by hand only (Actions › npu-model › Run
# workflow, on the branch to build): a build takes 15-30 minutes and every one needs a phone
# test, and a push trigger also fired whenever a branch merged main or touched this file.
on:
  workflow_dispatch:
    inputs:
      finetune:
        description: Fine-tune Qwen3-0.6B on engine/train first (about 1.5 hours on the runner)
        type: boolean
        default: false

concurrency:
  group: npu-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npu-model:
    # 24.04, not ubuntu-latest: on 26.04 libc++1 (LLVM 22) no longer brings in libunwind.so.1,
    # and the Qualcomm compiler plugin fails to load without it.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The runner's disk is mostly preinstalled toolchains; the build needs ~15 GB (Python
      # packages, the Hugging Face weights and three .litertlm stages) plus swap for the export.
      - name: Disk space and swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          df -h / && free -g
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install litert-torch and the Qualcomm SDK
        run: |
          # QAIRT's x86_64 libraries are built against LLVM's libc++, which the runner lacks.
          sudo apt-get update -q && sudo apt-get install -y -q libc++1 libc++abi1
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          # litert-torch main: the NPU pipeline and its Qwen3-0.6B / SM8750 config are newer
          # than the last release. Installing the SDK package downloads QAIRT 2.50 from Qualcomm.
          pip install -c android/npu-model/constraints.txt \
            "litert-torch @ git+https://github.com/google-ai-edge/litert-torch.git@c677a8069d63fc86a6d14e11168dfc387fd9357c" \
            ai-edge-litert-sdk-qualcomm-nightly==2.4.0.dev20261024
          python -c "import ai_edge_litert_sdk_qualcomm as q; p = q.path_to_sdk_libs(); print(p); assert p and p.is_dir()"
      # Optional: a LoRA fine-tune on the hand-written training set (engine/train), merged into a
      # Hugging Face checkpoint that the export below takes instead of Qwen/Qwen3-0.6B. Cached by
      # its inputs, so a rebuild of the same model skips the training.
      - uses: actions/setup-node@v4
        if: inputs.finetune
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        if: inputs.finetune
        id: finetuned
        with:
          path: ${{ runner.temp }}/qwen3-serene
          key: npu-finetuned-${{ hashFiles('engine/train/**', 'engine/src/host/classifier.mjs', 'android/npu-model/constraints.txt') }}
      - name: Fine-tune
        if: inputs.finetune && steps.finetuned.outputs.cache-hit != 'true'
        run: |
          pip install -c android/npu-model/constraints.txt peft accelerate
          node engine/train/make-train.mjs --check
          node engine/train/make-train.mjs > "$RUNNER_TEMP/train.jsonl"
          node engine/train/prompts.mjs "$RUNNER_TEMP/train.jsonl" > "$RUNNER_TEMP/train-prompts.jsonl"
          python engine/train/finetune.py --prompts "$RUNNER_TEMP/train-prompts.jsonl" --out "$RUNNER_TEMP/qwen3-serene"
      - uses: actions/cache/save@v4
        if: inputs.finetune && steps.finetuned.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/qwen3-serene
          key: ${{ steps.finetuned.outputs.cache-primary-key }}
      - name: Model to build
        run: echo "MODEL_ARG=${{ inputs.finetune && format('--model {0}/qwen3-serene', runner.temp) || '' }}" >> "$GITHUB_ENV"
      # The fine-tuned model for the GPU and CPU too, in the two shapes the app offers there: INT8
      # weights and 4-bit weights in blocks of 32, the recipes of the stock files on Hugging Face
      # (litert-community/Qwen3-0.6B), with their prefill and cache sizes (litert-torch's defaults)
      # and their metadata (qwen3-metadata.pbtext: chat template, stop token), because LiteRT-LM
      # can't apply the template the checkpoint carries. About 6 minutes each.
      - name: Export for the GPU and CPU
        if: inputs.finetune
        run: |
          out="$RUNNER_TEMP/gpu"
          for build in dynamic_wi8_afp32:Qwen3-0.6B-helmi.litertlm dynamic_wi4b32_afp32:Qwen3-0.6B-helmi_wi4b32.litertlm; do
            recipe=${build%%:*}
            python -m litert_torch.generative.export_hf --model "$RUNNER_TEMP/qwen3-serene" --output_dir "$out/$recipe" \
              --quantization_recipe "$recipe" --litert_lm_llm_metadata_override "$PWD/android/npu-model/qwen3-metadata.pbtext"
            mv "$out/$recipe/model.litertlm" "$out/${build#*:}"
            rm -rf "$out/$recipe"
          done
          cd "$out"
          ls -l
          sha256sum *.litertlm | tee SHA256SUMS
          echo "### GPU and CPU models" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.finetune
        with:
          name: gpu-model-${{ github.run_number }}-finetuned
          path: ${{ runner.temp }}/gpu/
          retention-days: 30
      # The first three stages take about 20 minutes and depend only on these inputs, so a
      # change to the compile stage reuses the quantized model. Saved before the compile, which
      # is the stage that fails.
      - uses: actions/cache/restore@v4
        id: quantized
        with:
          path: ${{ runner.temp }}/npu/quantized
          key: npu-quantized-c677a80-512-${{ inputs.finetune && hashFiles('engine/train/**', 'engine/src/host/classifier.mjs') || 'base' }}-${{ hashFiles('android/npu-model/calibration.jsonl', 'android/npu-model/constraints.txt') }}
      - name: Export, calibrate and quantize
        if: steps.quantized.outputs.cache-hit != 'true'
        run: python android/npu-model/build.py --work "$RUNNER_TEMP/npu" --stages export,calibrate,quantize $MODEL_ARG
      - uses: actions/cache/save@v4
        if: steps.quantized.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/npu/quantized
          key: ${{ steps.quantized.outputs.cache-primary-key }}
      # The app's dispatch library is LiteRT 2.3.0's (litert-npu-runtime-qualcomm), and a model
      # compiled by the nightly's plugin failed to allocate its tensors on the phone, so the compile
      # uses the 2.3.0 release's plugin. litert-torch still imports with it. Both use QAIRT 2.50.
      - name: Compile
        run: |
          pip install --no-deps --target "$RUNNER_TEMP/litert-2.3.0" ai-edge-litert==2.3.0
          PYTHONPATH="$RUNNER_TEMP/litert-2.3.0" python android/npu-model/build.py --work "$RUNNER_TEMP/npu" --stages compile $MODEL_ARG
      - name: Checksum
        run: |
          cd "$RUNNER_TEMP/npu/npu"
          ls -l
          sha256sum *.litertlm | tee SHA256SUMS
          echo "### NPU model" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: npu-model-${{ github.run_number }}${{ inputs.finetune && '-finetuned' || '' }}
          path: ${{ runner.temp }}/npu/npu/
          retention-days: 30
