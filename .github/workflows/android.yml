name: android

# Debug APK on every PR and every push to main, uploaded as an artifact you can sideload.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" > /dev/null
      - name: Rust for Android (adblock-rust over JNI)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rules-jni
          cache-all-crates: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules engine tests (host)
        working-directory: android/rules-jni
        run: cargo test --release
      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Name the APK
        id: apk
        run: |
          name="serene-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Serene debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **$name** under Artifacts below, unzip it on the phone and open the .apk. Builds share one debug key, so each one installs over the last." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/out/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  # The engine's fixture pages in the real app on an emulator: system WebView, document-start
  # script, SereneBridge, adblock-rust over JNI and the Kotlin policy, end to end.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$(find apks -name app-debug.apk)"
            adb install -r "$(find apks -name app-debug-androidTest.apk)"
            adb shell am instrument -w -r app.serene.browser.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "^OK (" instrument.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: instrument.txt
          if-no-files-found: ignore
