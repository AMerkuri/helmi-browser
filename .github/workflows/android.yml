name: android

# Debug APK on every PR and every push to main, uploaded as an artifact you can sideload.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the APK link in the PR description
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" > /dev/null
      # cargo-ndk takes over a minute to compile; keep the binary between runs.
      - uses: actions/cache@v4
        id: cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}
      - name: Rust for Android (adblock-rust over JNI)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          if [ "${{ steps.cargo-ndk.outputs.cache-hit }}" != "true" ]; then cargo install cargo-ndk --locked --version 4.1.2; fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rules-jni
          cache-all-crates: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules engine tests (host)
        working-directory: android/rules-jni
        run: cargo test --release
      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Name the APK
        id: apk
        run: |
          name="serene-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Serene debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **$name** under Artifacts below, unzip it on the phone and open the .apk. Builds share one debug key, so each one installs over the last." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/out/*.apk
          retention-days: 30
      # Keep a "Debug APK" section in the PR description pointing at this run's artifact.
      # Fork PRs get a read-only token, so they skip it.
      - name: Link the APK in the PR description
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const start = '<!-- serene-apk -->', end = '<!-- /serene-apk -->';
            const { APK_NAME: name, APK_URL: url } = process.env;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const section = [
              start,
              '### Debug APK',
              `[Download ${name}](${url}) (built from ${sha}, kept 30 days). Unzip it on the phone and open the .apk; it installs over earlier builds.`,
              end,
            ].join('\n');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const body = pr.body || '';
            // Markers on lines of their own, so a description that quotes them stays intact.
            const re = new RegExp(`^${start}$[\\s\\S]*?^${end}$`, 'm');
            const next = re.test(body) ? body.replace(re, () => section) : `${body.trimEnd()}\n\n${section}\n`;
            if (next !== body) await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, body: next });
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  # The engine's fixture pages in the real app on an emulator: system WebView, document-start
  # script, SereneBridge, adblock-rust over JNI and the Kotlin policy, end to end.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A cached boot snapshot was tried: the 2.2 GB AVD took longer to restore (~65 s)
          # than the cold boot it saved (~40 s). Not saving one on exit saves ~12 s.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$(find apks -name app-debug.apk)"
            adb install -r "$(find apks -name app-debug-androidTest.apk)"
            adb logcat -c
            adb shell am instrument -w -r app.serene.browser.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb logcat -d -v time > logcat.txt
            adb logcat -d -b crash > crash.txt
            cat crash.txt
            grep -q "^OK (" instrument.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: |
            instrument.txt
            logcat.txt
            crash.txt
          if-no-files-found: ignore
