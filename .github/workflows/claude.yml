name: claude

# Claude Code (anthropics/claude-code-action) works issues and "@claude" requests here, as the
# Claude GitHub App. Needs the app installed on the repo and one of two secrets:
# CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, bills a Claude plan) or ANTHROPIC_API_KEY.
#
# - A new issue from someone with write access (a "Report missed popup" filed from the app, say)
#   is worked straight away: Claude pushes a claude/issue-N-... branch and opens a PR for it.
# - Anyone else's issue waits until a maintainer adds the `claude` label, because issues are
#   public and their text becomes Claude's instructions.
# - "@claude ..." in an issue or PR comment, a PR review or a review comment, from someone with
#   write access, answers or pushes to that issue or PR.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue or PR at a time; a second request queues behind the first.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ISSUE_PROMPT: |
    Work this issue to a pull request without waiting for anyone.

    For a missed popup (label missed-popup): the issue has the page address, what the engine
    did (candidates, verdicts, page log) and the overlay's HTML. Find which layer should have
    caught it (filter lists, cosmetic rules, autoconsent, the detector and heuristics in
    engine/src/content/serene.js, or the policy in engine/src/host/policy.mjs). Fix it there,
    and add a fixture under engine/test/fixtures that imitates the overlay (hand-written, not a
    copy of the site) with its expected verdict. Run `npm test` in engine/, which also rebuilds
    engine/dist; commit dist with the change. If you change engine/src/host, port the change to
    android/app/src/main/kotlin/app/serene/engine/ and its tests in the same branch. Never hide
    page content that is not an overlay: a false positive is worse than a miss.

    When the branch is pushed, open the PR yourself:
    `gh pr create --base main --head <your branch> --title "<what it fixes>" --body "Fixes #<issue>. <what changed and how you tested it>"`
    and put the PR link in your comment instead of a "Create a PR" link. The PR's CI builds a
    debug APK to try the fix on a phone.

    If the report is not actionable (the page has no overlay any more, or it is not
    something Serene should remove), say why in your comment and do not open a PR.

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        && !contains(github.event.issue.labels.*.name, 'claude'))
      || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
      || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # the action trades it for a Claude GitHub App token
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # The engine and its fixture tests, so Claude can run `npm test` before pushing.
      # The Android build is left to the PR's own android workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # Same node_modules cache as the engine workflow: adblock-rs compiles on install.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: |
            engine/node_modules
            !engine/node_modules/@node-llama-cpp/linux-x64-cuda*
            !engine/node_modules/adblock-rs/target
          key: engine-node-modules-${{ runner.os }}-node22-${{ hashFiles('engine/package-lock.json') }}
      - name: Engine dependencies
        working-directory: engine
        run: |
          if [ "${{ steps.node-modules.outputs.cache-hit }}" != "true" ]; then npm ci; fi
          npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A prompt on comment events would switch the action out of @claude (tag) mode,
          # so only issue events get one. track_progress keeps the progress comment for them.
          prompt: ${{ github.event_name == 'issues' && env.ISSUE_PROMPT || '' }}
          track_progress: ${{ github.event_name == 'issues' }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --model opus --effort high
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*),WebFetch"
