name: engine

on:
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # adblock-rs compiles Brave's adblock-rust on install; the runner image ships Rust.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The app packages dist/ as assets: the committed copy must match the build.
      - run: git diff --exit-code -- dist
