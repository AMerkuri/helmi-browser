<script>
// The sign-in dialog loads its form (a frame and a captcha on the real thing) before it shows:
// it comes up seconds after the tap. ?auto: it opens on its own, with no tap.
const AFTER_MS = 3000;
function openSignIn(){setTimeout(()=>{document.documentElement.classList.add('zz-lock');document.body.insertAdjacentHTML('beforeend','<div id="signin" class="zz-shade"><div class="zz-box" role="dialog" aria-modal="true"><h2>Logi sisse</h2><p>Sisesta e-posti aadress ja parool.</p><input type="email" placeholder="E-post"> <input type="password" placeholder="Parool"><p><button>Jätka</button> <button>Unustasid parooli?</button> <button onclick="this.closest(\'.zz-shade\').remove();document.documentElement.classList.remove(\'zz-lock\')">Sulge</button></p></div></div>')},AFTER_MS)}
if(location.search.includes('auto'))addEventListener('load',openSignIn);
</script>
<header><a id="news" href="#">Uudised</a><button id="sisene" onclick="openSignIn()">Sisene</button></header>
