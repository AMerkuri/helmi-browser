<!doctype html><title>Estonian cookie dialog, full-screen wrapper with inline links</title><meta name="viewport" content="width=device-width"><style>body{font:16px sans-serif;margin:0} main p{margin:16px} .ck-wrap a{color:#39f}</style><script>window.__clicked=[];function clk(n,el){__clicked.push(n);document.getElementById('et-cookie-dialog').remove();document.documentElement.style.overflow=''}</script>
<script type="application/json" id="expect">{"gone":"#et-cookie-dialog","visible":["#page","#topbar"],"clicked":["keeldu"],"notClicked":["noustu","seaded"],"scroll":true,"via":"heuristic","llm":{"label":"content"}}</script>
<header id="topbar" style="position:sticky;top:0;background:#111;color:#fff;padding:14px;z-index:5">Pank <a href="#" style="color:#fff">Sisene</a></header>
<main id="page"><h1>Kodulaen uuele kodule</h1><p>Arvuta kuumakse ja vaata, millised tingimused sinu kodulaenule kehtivad.</p><p>Taotluse saad esitada internetipangas, vastuse saad tavaliselt kahe tööpäeva jooksul.</p><p style="height:1500px">Pikem tekst, et leht keriks.</p></main>
<script>
// The bank's own consent dialog (no consent tool): a full-screen fixed wrapper with a dimmed layer
// and a card in it, a language toggle, and links in the text, so it has more than six controls.
// Its text has no English or other keyword the lists of cookie words knew before (#48); only
// the wrapper's id says "cookie". Rendered by a script after load, with a scroll lock.
setTimeout(()=>{document.documentElement.style.overflow='hidden';document.body.insertAdjacentHTML('beforeend',`<div id="et-cookie-dialog" class="ck-wrap" role="dialog" aria-modal="true" style="position:fixed;inset:0;display:flex;align-items:flex-end"><div style="position:fixed;inset:0;background:rgba(0,0,0,.35)"></div><div style="position:relative;background:#141414;color:#eee;margin:16px;padding:20px;border-radius:8px"><button style="float:right">ET</button><h2>Küpsised</h2><p><a href="#">Meie</a> lehel on <a href="#">vajalikud küpsised</a>, ilma milleta leht ei tööta. Valikulisi küpsiseid kasutame, et lehte paremaks teha ja näidata sulle sobivaid pakkumisi. Rohkem infot leiad <a href="#">küpsiste kasutamise kohta</a> ja <a href="#">andmekaitse põhimõtetest</a>.</p><button onclick="clk('keeldu',this)">Keeldu kõigist</button> <button onclick="clk('noustu',this)">Nõustu kõigiga</button> <button onclick="clk('seaded',this)">Muuda seadeid</button></div></div>`)},500);
</script>
