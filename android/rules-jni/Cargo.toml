[package]
name = "serene-rules"
version = "0.1.0"
edition = "2021"
publish = false
description = "adblock-rust (Brave) for Serene, called from Kotlin over JNI"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same crate and version the engine prototype runs through adblock-rs 0.13.3.
# No "single-thread": the engine must be Sync, WebView calls shouldInterceptRequest on many threads.
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
jni = "0.21"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
